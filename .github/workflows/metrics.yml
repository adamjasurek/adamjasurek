# Daily GitHub stats for the profile README, including private repositories.
# Shows aggregate counts and language totals only — no private repo names.
#
# Required secret (repo Settings → Secrets and variables → Actions):
#   METRICS_TOKEN  — a personal access token that can read private repos.
#     Classic: "repo" scope (and optionally read:user).
#     Fine-grained: read-only Contents on every private repo to include,
#     plus Account → Profile read if available.
#   Do not use GITHUB_TOKEN here; it cannot see other private repositories.
#
# Also turn on GitHub → Settings → Profile → "Include private contributions
# on my profile" so private contribution counts can be included.
#
# The workflow needs `permissions: contents: write` so the default
# GITHUB_TOKEN can commit the generated SVGs back to this repository.

name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: General stats
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adamjasurek
          filename: github-metrics.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: Update github-metrics.svg - [Skip GitHub Action]
          config_timezone: Europe/Prague
          config_display: regular
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories: 200
          repositories_affiliations: owner
          retries_output_action: 5
          retries_delay_output_action: 30
          extras_css: |
            svg {
              background-color: #FFF8EB !important;
              color: #111111 !important;
              outline: 4px solid #111111;
              outline-offset: -4px;
            }
            .items-wrapper {
              background-color: #FFF8EB !important;
            }
            h1, h2, h3 {
              color: #111111 !important;
              font-weight: 700 !important;
            }
            .field svg {
              fill: #FF4D8D !important;
            }
            footer {
              color: #333333 !important;
            }
            :root {
              --color-calendar-graph-day-bg: #EFE6D2;
              --color-calendar-graph-day-L1-bg: #FFE58A;
              --color-calendar-graph-day-L2-bg: #FFD60A;
              --color-calendar-graph-day-L3-bg: #C6FF4D;
              --color-calendar-graph-day-L4-bg: #111111;
            }

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adamjasurek
          filename: metrics-languages.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: Update metrics-languages.svg - [Skip GitHub Action]
          config_timezone: Europe/Prague
          config_display: regular
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_colors: github
          retries_output_action: 5
          retries_delay_output_action: 30
          extras_css: |
            svg {
              background-color: #FFF8EB !important;
              color: #111111 !important;
              outline: 4px solid #111111;
              outline-offset: -4px;
            }
            .items-wrapper {
              background-color: #FFF8EB !important;
            }
            h1, h2, h3 {
              color: #111111 !important;
              font-weight: 700 !important;
            }
            .field svg {
              fill: #FF4D8D !important;
            }
            footer {
              color: #333333 !important;
            }

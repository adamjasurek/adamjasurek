# Daily profile card for the GitHub profile README.
# Writes only aggregate counts and a contribution heatmap — no repo names.
#
# Required secret (repo Settings → Secrets and variables → Actions):
#   METRICS_TOKEN — classic PAT with `repo` and `read:user` scopes
#   (or a fine-grained token that can read private repos).
#   Do not use GITHUB_TOKEN for the API call; it cannot see other private repos.
#
# Keep GitHub → Settings → Profile → "Include private contributions
# on my profile" enabled so the calendar and commit totals can include
# private work.
#
# permissions: contents: write lets the default GITHUB_TOKEN commit
# profile-card.svg and profile-card-dark.svg back to this repository.
#
# After publishing, delete leftover github-metrics.svg and
# metrics-languages.svg from the repo if they are still present.

name: Profile card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  profile-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile card
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/profile_card.py --output profile-card.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg profile-card-dark.svg
          if git diff --staged --quiet; then
            echo "No changes to profile cards"
          else
            git commit -m "[skip ci] Update profile card"
            git push
          fi
